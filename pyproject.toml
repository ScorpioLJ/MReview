[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mreview"
version = "0.1.0"
description = "Model design / training review CLI: unit split, deterministic tool checks, weight checks, ledger verification"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "safetensors",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
mreview = "mreview.cli:main"

[tool.setuptools.packages.find]
include = ["mreview*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["fixtures"]
